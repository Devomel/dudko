services:
  db:
    image: postgres:16-alpine
    container_name: dudko_scrapper_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: scrapper
      POSTGRES_USER: scrapper
      POSTGRES_PASSWORD: scrapper
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed_products.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./db/seed_sales.sql:/docker-entrypoint-initdb.d/03_sales.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapper -d scrapper"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: dudko_scrapper_api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: scrapper
      DB_USER: scrapper
      DB_PASSWORD: scrapper
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./files:/app/files
      - ./api:/app/api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: dudko_scrapper_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pgdata:
